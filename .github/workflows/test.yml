name: Test

on:
  push:
    branches: [ main, work, develop ]
  pull_request:
    branches: [ main, work, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Build
      run: |
        xcodebuild clean build-for-testing \
          -project cutter2.xcodeproj \
          -scheme cutter2 \
          -destination 'platform=macOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO
      
    - name: Run tests
      run: |
        xcodebuild test-without-building \
          -project cutter2.xcodeproj \
          -scheme cutter2 \
          -destination 'platform=macOS' \
          -enableCodeCoverage YES \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO
      
    - name: Analyze
      run: |
        xcodebuild analyze \
          -project cutter2.xcodeproj \
          -scheme cutter2 \
          -destination 'platform=macOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO
      
    - name: Generate code coverage report
      run: |
        xcrun llvm-cov export \
          -format="lcov" \
          -instr-profile=$(find ~/Library/Developer/Xcode/DerivedData -name "Coverage.profdata" | head -1) \
          $(find ~/Library/Developer/Xcode/DerivedData -name "cutter2" -type f | head -1) \
          > coverage.lcov || echo "Coverage report generation skipped"
      
    - name: Upload coverage to artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.lcov
        if-no-files-found: ignore
